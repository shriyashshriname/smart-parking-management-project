<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Parking Animation</title>
<style>
  body {
    margin: 0; padding: 0;
    background: transparent;
    display: flex; align-items: center; justify-content: center;
    height: 100vh; overflow: hidden;
  }
  
  .parking-lot {
    width: 400px; height: 300px;
    background: #18181b;
    border: 1px solid #27272a;
    border-radius: 16px;
    position: relative;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    overflow: hidden;
  }

  /* Road */
  .road {
    position: absolute;
    top: 50%; left: 0; width: 100%; height: 60px;
    background: #09090b;
    transform: translateY(-50%);
    border-top: 1px dashed #3f3f46;
    border-bottom: 1px dashed #3f3f46;
  }

  /* Slots Top */
  .slot {
    position: absolute; width: 50px; height: 80px;
    border: 2px solid #3f3f46; border-bottom: none;
    top: 20px; box-sizing: border-box; border-radius: 8px 8px 0 0;
    display: flex; align-items: center; justify-content: center;
    color: #52525b; font-family: monospace; font-size: 14px;
  }
  .slot.available { border-color: #22c55e; color: #22c55e; background: rgba(34, 197, 94, 0.05); }
  
  .slot-t1 { left: 40px; } .slot-t2 { left: 110px; } .slot-t3 { left: 180px; } .slot-t4 { left: 250px; } .slot-t5 { left: 320px; }
  
  /* Slots Bottom */
  .slot-b {
    position: absolute; width: 50px; height: 80px;
    border: 2px solid #3f3f46; border-top: none;
    bottom: 20px; box-sizing: border-box; border-radius: 0 0 8px 8px;
    display: flex; align-items: center; justify-content: center;
    color: #52525b; font-family: monospace; font-size: 14px;
  }
  .slot-b.available { border-color: #22c55e; color: #22c55e; background: rgba(34, 197, 94, 0.05); }
  .slot-b1 { left: 40px; } .slot-b2 { left: 110px; } .slot-b3 { left: 180px; } .slot-b4 { left: 250px; } .slot-b5 { left: 320px; }

  /* Cars */
  .car {
    position: absolute; width: 40px; height: 70px;
    border-radius: 8px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.5);
    display: flex; align-items: center; justify-content: center;
    z-index: 10;
  }
  /* Simple car graphics via CSS */
  .car::before {
    content: ''; position: absolute; width: 30px; height: 20px;
    background: rgba(0,0,0,0.5); border-radius: 4px; top: 15px;
  }
  .car::after {
    content: ''; position: absolute; width: 30px; height: 15px;
    background: rgba(0,0,0,0.5); border-radius: 4px; bottom: 10px;
  }
  
  .car-blue { background: #3b82f6; }
  .car-red { background: #ef4444; }
  .car-gold { background: #eab308; }
  .car-purple { background: #a855f7; }
  .car-green { background: #22c55e; }

  /* Static Cars */
  .static-t1 { top: 25px; left: 45px; }
  .static-t4 { top: 25px; left: 255px; }
  .static-b2 { bottom: 25px; left: 115px; }
  .static-b5 { bottom: 25px; left: 325px; }

  /* Animations */
  
  /* Car 1: Drives from left, parks in t3, leaves right */
  .anim-car-1 {
    top: 130px; left: -60px;
    transform: rotate(90deg);
    animation: parkCar1 10s infinite linear;
  }
  @keyframes parkCar1 {
    0%   { top: 130px; left: -60px; transform: rotate(90deg); }
    15%  { top: 130px; left: 185px; transform: rotate(90deg); }
    25%  { top: 25px; left: 185px; transform: rotate(0deg); }
    65%  { top: 25px; left: 185px; transform: rotate(0deg); }
    75%  { top: 130px; left: 185px; transform: rotate(90deg); }
    100% { top: 130px; left: 450px; transform: rotate(90deg); }
  }

  /* Car 2: Drives from right, parks in b3, leaves left */
  .anim-car-2 {
    bottom: 130px; right: -60px;
    transform: rotate(-90deg);
    animation: parkCar2 12s infinite linear 2s; /* Delayed start */
    opacity: 0;
  }
  @keyframes parkCar2 {
    0%   { bottom: 130px; right: -60px; transform: rotate(-90deg); opacity: 1; }
    15%  { bottom: 130px; right: 185px; transform: rotate(-90deg); opacity: 1; }
    25%  { bottom: 25px; right: 185px; transform: rotate(0deg); opacity: 1; }
    65%  { bottom: 25px; right: 185px; transform: rotate(0deg); opacity: 1; }
    75%  { bottom: 130px; right: 185px; transform: rotate(-90deg); opacity: 1; }
    99%  { bottom: 130px; right: 450px; transform: rotate(-90deg); opacity: 1; }
    100% { bottom: 130px; right: 450px; transform: rotate(-90deg); opacity: 0; }
  }

  /* Car 3: Drives from left, parks in t2, leaves right */
  .anim-car-3 {
    top: 130px; left: -60px;
    transform: rotate(90deg);
    animation: parkCar3 14s infinite linear 5s; /* Delayed start */
    opacity: 0;
  }
  @keyframes parkCar3 {
    0%   { top: 130px; left: -60px; transform: rotate(90deg); opacity: 1; }
    15%  { top: 130px; left: 115px; transform: rotate(90deg); opacity: 1; }
    25%  { top: 25px; left: 115px; transform: rotate(0deg); opacity: 1; }
    65%  { top: 25px; left: 115px; transform: rotate(0deg); opacity: 1; }
    75%  { top: 130px; left: 115px; transform: rotate(90deg); opacity: 1; }
    99%  { top: 130px; left: 450px; transform: rotate(90deg); opacity: 1; }
    100% { top: 130px; left: 450px; transform: rotate(90deg); opacity: 0; }
  }
  
  /* Slot colors dynamically changing with CSS to simulate booking/freeing */
  .dyn-slot-t3 { animation: slotColor1 10s infinite linear; }
  @keyframes slotColor1 {
    0%, 20%, 80%, 100% { border-color: #22c55e; color: #22c55e; background: rgba(34, 197, 94, 0.05); }
    25%, 75% { border-color: #3f3f46; color: transparent; background: transparent; }
  }

  .dyn-slot-b3 { animation: slotColor2 12s infinite linear 2s; border-color: #22c55e; color: #22c55e; background: rgba(34, 197, 94, 0.05); }
  @keyframes slotColor2 {
    0%, 20%, 80%, 100% { border-color: #22c55e; color: #22c55e; background: rgba(34, 197, 94, 0.05); }
    25%, 75% { border-color: #3f3f46; color: transparent; background: transparent; }
  }

  .dyn-slot-t2 { animation: slotColor3 14s infinite linear 5s; border-color: #22c55e; color: #22c55e; background: rgba(34, 197, 94, 0.05); }
  @keyframes slotColor3 {
    0%, 20%, 80%, 100% { border-color: #22c55e; color: #22c55e; background: rgba(34, 197, 94, 0.05); }
    25%, 75% { border-color: #3f3f46; color: transparent; background: transparent; }
  }

</style>
</head>
<body>

<div class="parking-lot">
  <div class="road"></div>
  
  <!-- Top Slots -->
  <div class="slot slot-t1">P1</div>
  <div class="slot slot-t2 dyn-slot-t2">P2</div>
  <div class="slot slot-t3 dyn-slot-t3">P3</div>
  <div class="slot slot-t4">P4</div>
  <div class="slot slot-t5 available">P5</div>

  <!-- Bottom Slots -->
  <div class="slot-b slot-b1 available">P6</div>
  <div class="slot-b slot-b2">P7</div>
  <div class="slot-b slot-b3 dyn-slot-b3">P8</div>
  <div class="slot-b slot-b4 available">P9</div>
  <div class="slot-b slot-b5">P10</div>

  <!-- Static Cars -->
  <div class="car car-red static-t1"></div>
  <div class="car car-purple static-t4"></div>
  <div class="car car-blue static-b2"></div>
  <div class="car car-green static-b5"></div>

  <!-- Animated Cars -->
  <div class="car car-gold anim-car-1"></div>
  <div class="car car-red anim-car-2"></div>
  <div class="car car-blue anim-car-3"></div>

</div>

</body>
</html>
